<script>
async function WELT_ACTIVE() {

    // active.rom laden
    const rom = await fetch("./active.rom").then(r => r.text());

    // ROM in Zeilen zerlegen
    const lines = rom.split("\n").map(l => l.trim());

    // Zustand extrahieren
    const STATE = {};
    for (const line of lines) {
        if (line.includes(":")) {
            const [key, val] = line.split(":");
            STATE[key.trim()] = val.trim();
        }
    }

    // Portal aktivieren
    if (STATE.PORTAL === "ON") {
        console.log("WELT Portal aktiviert");
        window.WELT_PORTAL_ACTIVE = true;
    }

    // NC² aktivieren
    if (STATE.NC2 === "ON") {
        console.log("NC² Routing aktiviert");
        window.NC2_ACTIVE = true;
    }

    // TMP-Kern öffnen
    if (STATE.TMP === "OPEN") {
        console.log("TMP Kern geöffnet");
        window.TMP_OPEN = true;
    }

    // Hyperraum aktivieren
    if (STATE.ALL === "ON") {
        console.log("ALL Hyperraum aktiviert");
        window.ALL_ACTIVE = true;
    }

    // Sprache setzen
    if (STATE.LANG) {
        console.log("Sprache gesetzt:", STATE.LANG);
        window.WELT_LANG = STATE.LANG;
    }
}

// Starten
WELT_ACTIVE();
</script>
