<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WELT · MA³ · Orbit‑Geo‑Core</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:30px; }
h1 { color:#6cf; margin-bottom:20px; }
canvas { background:#111; border:1px solid #0f0; display:block; margin-top:20px; }
pre { background:#111; padding:10px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<h1>WELT · MA³ · Orbit‑Geo‑Core</h1>
<canvas id="weltCanvas" width="700" height="450"></canvas>

<pre id="geo">Lade geo.md Ebenen…</pre>

<script>
// ------------------------------------------------------
// WELT.ORBIT.MA³ – FINAL VERSION
// ------------------------------------------------------

const c = document.getElementById("weltCanvas");
const x = c.getContext("2d");

let t = 0;

// 3 Atome
const atoms = [
  { r: 100, speed: 0.03, color: "#0ff" },
  { r: 150, speed: 0.02, color: "#f0f" },
  { r: 200, speed: 0.015, color: "#ff0" }
];

// 6 geo.md Ebenen laden
async function loadGeo(){
  try{
    const r = await fetch("./geo.md");
    const txt = await r.text();
    document.getElementById("geo").textContent = txt;
  }catch(e){
    document.getElementById("geo").textContent = "geo.md fehlt";
  }
}
loadGeo();

// ------------------------------------------------------
// RENDER LOOP
// ------------------------------------------------------

function renderWELT(){
  x.clearRect(0,0,c.width,c.height);

  const cx = c.width/2;
  const cy = c.height/2;

  // ------------------------------------------------------
  // 1. WELT‑BUCHSTABEN (WL) – 360° Rotation
  // ------------------------------------------------------
  x.save();
  x.translate(cx, cy);
  x.rotate(t);

  x.fillStyle = "#6cf";
  x.font = "bold 150px Consolas";
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.fillText("WL", 0, 0);

  x.restore();

  // ------------------------------------------------------
  // 2. ATOM‑ORBIT (3 Atome)
  // ------------------------------------------------------
  atoms.forEach((atom, i)=>{
    const angle = t * (1 + atom.speed * 20);

    const ax = cx + Math.cos(angle + i) * atom.r;
    const ay = cy + Math.sin(angle + i) * atom.r;

    x.fillStyle = atom.color;
    x.beginPath();
    x.arc(ax, ay, 12, 0, Math.PI*2);
    x.fill();
  });

  // ------------------------------------------------------
  // 3. MA³‑CORE (Zentrum)
  // ------------------------------------------------------
  x.fillStyle = "#0f0";
  x.beginPath();
  x.arc(cx, cy, 10, 0, Math.PI*2);
  x.fill();

  t += 0.01;
  requestAnimationFrame(renderWELT);
}

renderWELT();
<script>
function WELT_ROUTER(){
  const path = window.location.pathname;

  // YAML → Ordner-Redirect
  if(path.endsWith(".yml") || path.endsWith(".yaml")){
    const folder = path.split("/").slice(0,-1).join("/") + "/";
    window.location.href = folder;
    return;
  }

  // ROM → Portal-Loader
  if(path.endsWith(".rom")){
    fetch(path)
      .then(r => r.text())
      .then(data => {
        console.log("ROM geladen:", data);
        window.location.href = "/WELT.portal";
      });
    return;
  }

  // SCAN → Raum-Loader
  if(path.endsWith(".scan")){
    fetch(path)
      .then(r => r.text())
      .then(scan => {
        console.log("SCAN:", scan);
        window.location.href = "/WELT.room";
      });
    return;
  }
}

WELT_ROUTER();




</script>

</body>
</html>
