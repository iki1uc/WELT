<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WELT · RESPO · Portal-System</title>

<style>
  body { background:#000; color:#00ffff; font-family:Consolas; padding:20px; }
  h1 { color:#33ccff; text-shadow:0 0 10px #00ffff; }
  pre { background:#111; padding:15px; border-radius:8px; }
</style>

<script>
async function WELT_ACTIVE() {

    let rom;
    try {
        rom = await fetch("./active.rom").then(r => r.text());
    } catch(e){
        document.getElementById("state").innerHTML =
            "FEHLER: active.rom konnte nicht geladen werden.";
        return;
    }

    const lines = rom.split("\n").map(l => l.trim());
    const STATE = {};

    for (const line of lines) {
        if (line.includes(":")) {
            const [key, val] = line.split(":");
            STATE[key.trim()] = val.trim();
        }
    }

    let out = "";

    if (STATE.PORTAL === "ON") {
        window.WELT_PORTAL_ACTIVE = true;
        out += "Portal: AKTIV\n";
    } else out += "Portal: AUS\n";

    if (STATE.NC2 === "ON") {
        window.NC2_ACTIVE = true;
        out += "NC²: AKTIV\n";
    } else out += "NC²: AUS\n";

    if (STATE.TMP === "OPEN") {
        window.TMP_OPEN = true;
        out += "TMP-Kern: OFFEN\n";
    } else out += "TMP-Kern: GESCHLOSSEN\n";

    if (STATE.ALL === "ON") {
        window.ALL_ACTIVE = true;
        out += "Hyperraum: AKTIV\n";
    } else out += "Hyperraum: AUS\n";

    if (STATE.LANG) {
        window.WELT_LANG = STATE.LANG;
        out += "Sprache: " + STATE.LANG + "\n";
    }

    document.getElementById("state").innerText = out;
}

window.onload = WELT_ACTIVE;
</script>
</head>

<body>

<h1>WELT · Portal-System</h1>

<pre id="state">Lade active.rom …</pre>

</body>
</html>
