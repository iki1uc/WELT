<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WELT · Portal‑System · iki1uc</title>

<style>
body {
  background:#000;
  color:#0ff;
  font-family:Consolas, monospace;
  padding:20px;
}

h1 {
  color:#6cf;
  text-shadow:0 0 15px #6cf;
  text-align:center;
}

.block {
  border:1px solid #0ff;
  padding:20px;
  margin:25px 0;
  background:#111;
  border-radius:10px;
}

#portal, #room, #bridge, #geo {
  padding:15px;
  background:#000;
  border:1px solid #333;
  border-radius:8px;
  margin-top:10px;
}

#geo {
  font-size:26px;
  text-align:center;
  letter-spacing:6px;
  transition:0.4s;
}
</style>
</head>

<body>

<h1>WELT · Portal‑System</h1>

<div class="block">
  <h2>Portal‑Viewer</h2>
  <pre id="portal"></pre>
</div>

<div class="block">
  <h2>Room‑Visualizer</h2>
  <pre id="room"></pre>
</div>

<div class="block">
  <h2>Universe‑Bridge</h2>
  <pre id="bridge"></pre>
</div>

<div class="block">
  <h2>Geo‑Formation</h2>
  <div id="geo"></div>
</div>

<script type="module">
import "./raum.js"; // setzt dataset.welt

// Portal Viewer
document.getElementById("portal").textContent =
    "PORTAL: " + document.body.dataset.portal;

// Room Visualizer
document.getElementById("room").textContent =
    "ROOM: " + document.body.dataset.room;

// Universe Bridge
document.getElementById("bridge").textContent =
    "WELT‑Node: " + document.body.dataset.welt;

// Geo‑Formation
const geo = document.getElementById("geo");
if(document.body.dataset.welt.includes("portal")){
    geo.textContent = "WELT‑PORTAL";
    geo.style.color = "#ff0";
    geo.style.textShadow = "0 0 20px #ff0";
} else {
    geo.textContent = "WELT‑NODE";
    geo.style.color = "#0ff";
    geo.style.textShadow = "0 0 10px #0ff";
}
</script>

</body>
</html>
