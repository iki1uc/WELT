<!DOCTYPE html>
<html>
<body style="background:black;color:#0f0;font-family:Consolas">

<script>
// GLOBALER WELT-ROUTER (funktioniert für ALLE Respos)
(function(){
  const path = window.location.pathname;

  // YAML → Ordner-Redirect
  if(path.endsWith(".yml") || path.endsWith(".yaml")){
    const folder = path.split("/").slice(0,-1).join("/") + "/";
    window.location.href = folder;
    return;
  }

  // ROM → Portal-Loader
  if(path.endsWith(".rom")){
    window.location.href = "/WELT.portal";
    return;
  }

  // SCAN → Raum-Loader
  if(path.endsWith(".scan")){
    window.location.href = "/WELT.room";
    return;
  }

  // Fallback → WELT/index.html
  window.location.href = "/index.html";
})();
</script>

<h1>WELT · Redirect aktiv</h1>

</body>
</html>
